<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif" font-size="13">
  <style>
    .card { fill: #fff8e1; stroke: #555; stroke-width: 1.5; }
    .head { fill: #1976d2; }
    .head-text { fill: #fff; font-weight: bold; font-size: 14px; }
    .col-h { font-weight: bold; fill: #333; }
    text { fill: #222; }
  </style>

  <text x="450" y="25" text-anchor="middle" font-size="20" font-weight="bold">CRC Cards - TradeMate</text>

  <!-- User Card -->
  <rect class="card" x="20" y="50" width="280" height="170"/>
  <rect class="head" x="20" y="50" width="280" height="25"/>
  <text class="head-text" x="160" y="68" text-anchor="middle">User</text>
  <line x1="160" y1="80" x2="160" y2="220" stroke="#888"/>
  <text class="col-h" x="30" y="95">Responsibilities</text>
  <text class="col-h" x="170" y="95">Collaborators</text>
  <text x="30" y="115">• Register / Login</text>
  <text x="30" y="133">• Update profile</text>
  <text x="30" y="151">• Browse listings</text>
  <text x="30" y="169">• Send messages</text>
  <text x="30" y="187">• Place an order</text>
  <text x="170" y="115">Listing</text>
  <text x="170" y="133">Order</text>
  <text x="170" y="151">Message</text>
  <text x="170" y="169">Role</text>

  <!-- Listing Card -->
  <rect class="card" x="310" y="50" width="280" height="170"/>
  <rect class="head" x="310" y="50" width="280" height="25"/>
  <text class="head-text" x="450" y="68" text-anchor="middle">Listing</text>
  <line x1="450" y1="80" x2="450" y2="220" stroke="#888"/>
  <text class="col-h" x="320" y="95">Responsibilities</text>
  <text class="col-h" x="460" y="95">Collaborators</text>
  <text x="320" y="115">• Display product info</text>
  <text x="320" y="133">• Track status</text>
  <text x="320" y="151">• Belong to a category</text>
  <text x="320" y="169">• Linked to seller</text>
  <text x="460" y="115">User (Seller)</text>
  <text x="460" y="133">Category</text>
  <text x="460" y="151">Order</text>

  <!-- Order Card -->
  <rect class="card" x="600" y="50" width="280" height="170"/>
  <rect class="head" x="600" y="50" width="280" height="25"/>
  <text class="head-text" x="740" y="68" text-anchor="middle">Order</text>
  <line x1="740" y1="80" x2="740" y2="220" stroke="#888"/>
  <text class="col-h" x="610" y="95">Responsibilities</text>
  <text class="col-h" x="750" y="95">Collaborators</text>
  <text x="610" y="115">• Record purchase</text>
  <text x="610" y="133">• Track status</text>
  <text x="610" y="151">• Hold amount</text>
  <text x="610" y="169">• Linked to buyer/seller</text>
  <text x="750" y="115">User (Buyer)</text>
  <text x="750" y="133">User (Seller)</text>
  <text x="750" y="151">Listing</text>
  <text x="750" y="169">Review</text>

  <!-- Admin Card -->
  <rect class="card" x="20" y="240" width="280" height="170"/>
  <rect class="head" x="20" y="240" width="280" height="25"/>
  <text class="head-text" x="160" y="258" text-anchor="middle">Admin</text>
  <line x1="160" y1="270" x2="160" y2="410" stroke="#888"/>
  <text class="col-h" x="30" y="285">Responsibilities</text>
  <text class="col-h" x="170" y="285">Collaborators</text>
  <text x="30" y="305">• Manage users</text>
  <text x="30" y="323">• Assign roles</text>
  <text x="30" y="341">• Approve listings</text>
  <text x="30" y="359">• Delete content</text>
  <text x="170" y="305">User</text>
  <text x="170" y="323">Role</text>
  <text x="170" y="341">Listing</text>

  <!-- Category Card -->
  <rect class="card" x="310" y="240" width="280" height="170"/>
  <rect class="head" x="310" y="240" width="280" height="25"/>
  <text class="head-text" x="450" y="258" text-anchor="middle">Category</text>
  <line x1="450" y1="270" x2="450" y2="410" stroke="#888"/>
  <text class="col-h" x="320" y="285">Responsibilities</text>
  <text class="col-h" x="460" y="285">Collaborators</text>
  <text x="320" y="305">• Group listings</text>
  <text x="320" y="323">• Support sub-categories</text>
  <text x="320" y="341">• Used for filtering</text>
  <text x="460" y="305">Listing</text>
  <text x="460" y="323">Admin</text>

  <!-- Message Card -->
  <rect class="card" x="600" y="240" width="280" height="170"/>
  <rect class="head" x="600" y="240" width="280" height="25"/>
  <text class="head-text" x="740" y="258" text-anchor="middle">Message</text>
  <line x1="740" y1="270" x2="740" y2="410" stroke="#888"/>
  <text class="col-h" x="610" y="285">Responsibilities</text>
  <text class="col-h" x="750" y="285">Collaborators</text>
  <text x="610" y="305">• Send text body</text>
  <text x="610" y="323">• Mark read/unread</text>
  <text x="610" y="341">• Tied to listing</text>
  <text x="750" y="305">User (Sender)</text>
  <text x="750" y="323">User (Receiver)</text>
  <text x="750" y="341">Listing</text>

  <!-- Role Card -->
  <rect class="card" x="20" y="430" width="280" height="150"/>
  <rect class="head" x="20" y="430" width="280" height="25"/>
  <text class="head-text" x="160" y="448" text-anchor="middle">Role</text>
  <line x1="160" y1="460" x2="160" y2="580" stroke="#888"/>
  <text class="col-h" x="30" y="475">Responsibilities</text>
  <text class="col-h" x="170" y="475">Collaborators</text>
  <text x="30" y="495">• Define permissions</text>
  <text x="30" y="513">• Group users (RBAC)</text>
  <text x="30" y="531">• Restrict admin pages</text>
  <text x="170" y="495">User</text>
  <text x="170" y="513">Admin</text>

  <!-- Review Card -->
  <rect class="card" x="310" y="430" width="280" height="150"/>
  <rect class="head" x="310" y="430" width="280" height="25"/>
  <text class="head-text" x="450" y="448" text-anchor="middle">Review</text>
  <line x1="450" y1="460" x2="450" y2="580" stroke="#888"/>
  <text class="col-h" x="320" y="475">Responsibilities</text>
  <text class="col-h" x="460" y="475">Collaborators</text>
  <text x="320" y="495">• Store rating 1-5</text>
  <text x="320" y="513">• Store comment</text>
  <text x="320" y="531">• Linked to order</text>
  <text x="460" y="495">Order</text>
  <text x="460" y="513">User</text>

  <!-- Payment Card -->
  <rect class="card" x="600" y="430" width="280" height="150"/>
  <rect class="head" x="600" y="430" width="280" height="25"/>
  <text class="head-text" x="740" y="448" text-anchor="middle">Payment Gateway</text>
  <line x1="740" y1="460" x2="740" y2="580" stroke="#888"/>
  <text class="col-h" x="610" y="475">Responsibilities</text>
  <text class="col-h" x="750" y="475">Collaborators</text>
  <text x="610" y="495">• Process payments</text>
  <text x="610" y="513">• Return transaction id</text>
  <text x="610" y="531">• External API</text>
  <text x="750" y="495">Order</text>
  <text x="750" y="513">User (Buyer)</text>
</svg>
