<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Arial, sans-serif" font-size="12">
  <style>
    .entity { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
    .pk { font-weight: bold; text-decoration: underline; }
    .fk { font-style: italic; fill: #c62828; }
    .rel { fill: #fff59d; stroke: #f57f17; stroke-width: 1.5; }
    text { fill: #222; }
    line { stroke: #555; stroke-width: 1.5; }
  </style>

  <text x="500" y="25" text-anchor="middle" font-size="20" font-weight="bold">Enhanced Entity Relationship Diagram</text>

  <!-- ROLES -->
  <rect class="entity" x="20" y="60" width="170" height="120" rx="6"/>
  <text x="105" y="80" text-anchor="middle" font-weight="bold">ROLES</text>
  <line x1="20" y1="88" x2="190" y2="88"/>
  <text class="pk" x="30" y="105">role_id (PK)</text>
  <text x="30" y="125">role_name</text>
  <text x="30" y="145">description</text>

  <!-- USERS -->
  <rect class="entity" x="250" y="60" width="200" height="200" rx="6"/>
  <text x="350" y="80" text-anchor="middle" font-weight="bold">USERS</text>
  <line x1="250" y1="88" x2="450" y2="88"/>
  <text class="pk" x="260" y="105">user_id (PK)</text>
  <text x="260" y="125">first_name</text>
  <text x="260" y="145">last_name</text>
  <text x="260" y="165">email (UNIQUE)</text>
  <text x="260" y="185">password_hash</text>
  <text x="260" y="205">phone, address</text>
  <text class="fk" x="260" y="225">role_id (FK)</text>
  <text x="260" y="245">created_at</text>

  <!-- CATEGORIES -->
  <rect class="entity" x="20" y="300" width="170" height="140" rx="6"/>
  <text x="105" y="320" text-anchor="middle" font-weight="bold">CATEGORIES</text>
  <line x1="20" y1="328" x2="190" y2="328"/>
  <text class="pk" x="30" y="345">category_id (PK)</text>
  <text x="30" y="365">name</text>
  <text class="fk" x="30" y="385">parent_id (FK)</text>
  <text x="30" y="410" font-size="10" font-style="italic">recursive (sub-cat)</text>

  <!-- LISTINGS -->
  <rect class="entity" x="500" y="60" width="200" height="240" rx="6"/>
  <text x="600" y="80" text-anchor="middle" font-weight="bold">LISTINGS</text>
  <line x1="500" y1="88" x2="700" y2="88"/>
  <text class="pk" x="510" y="105">listing_id (PK)</text>
  <text class="fk" x="510" y="125">seller_id (FK)</text>
  <text class="fk" x="510" y="145">category_id (FK)</text>
  <text x="510" y="165">title</text>
  <text x="510" y="185">description</text>
  <text x="510" y="205">price</text>
  <text x="510" y="225">condition_type</text>
  <text x="510" y="245">location</text>
  <text x="510" y="265">status</text>
  <text x="510" y="285">created_at</text>

  <!-- ORDERS -->
  <rect class="entity" x="760" y="60" width="200" height="200" rx="6"/>
  <text x="860" y="80" text-anchor="middle" font-weight="bold">ORDERS</text>
  <line x1="760" y1="88" x2="960" y2="88"/>
  <text class="pk" x="770" y="105">order_id (PK)</text>
  <text class="fk" x="770" y="125">listing_id (FK)</text>
  <text class="fk" x="770" y="145">buyer_id (FK)</text>
  <text class="fk" x="770" y="165">seller_id (FK)</text>
  <text x="770" y="185">amount</text>
  <text x="770" y="205">status</text>
  <text x="770" y="225">ordered_at</text>

  <!-- MESSAGES -->
  <rect class="entity" x="250" y="380" width="200" height="180" rx="6"/>
  <text x="350" y="400" text-anchor="middle" font-weight="bold">MESSAGES</text>
  <line x1="250" y1="408" x2="450" y2="408"/>
  <text class="pk" x="260" y="425">message_id (PK)</text>
  <text class="fk" x="260" y="445">sender_id (FK)</text>
  <text class="fk" x="260" y="465">receiver_id (FK)</text>
  <text class="fk" x="260" y="485">listing_id (FK)</text>
  <text x="260" y="505">body</text>
  <text x="260" y="525">sent_at</text>
  <text x="260" y="545">is_read</text>

  <!-- REVIEWS -->
  <rect class="entity" x="540" y="380" width="200" height="160" rx="6"/>
  <text x="640" y="400" text-anchor="middle" font-weight="bold">REVIEWS</text>
  <line x1="540" y1="408" x2="740" y2="408"/>
  <text class="pk" x="550" y="425">review_id (PK)</text>
  <text class="fk" x="550" y="445">order_id (FK)</text>
  <text class="fk" x="550" y="465">reviewer_id (FK)</text>
  <text x="550" y="485">rating (1-5)</text>
  <text x="550" y="505">comment</text>
  <text x="550" y="525">created_at</text>

  <!-- Relationships (simple lines + cardinalities) -->
  <line x1="190" y1="120" x2="250" y2="165"/>
  <text x="200" y="140" font-size="11">1..N has</text>

  <line x1="450" y1="160" x2="500" y2="125"/>
  <text x="455" y="130" font-size="11">1..N sells</text>

  <line x1="190" y1="360" x2="500" y2="160"/>
  <text x="280" y="280" font-size="11">1..N in</text>

  <line x1="700" y1="160" x2="760" y2="160"/>
  <text x="710" y="155" font-size="11">1..N orders</text>

  <line x1="450" y1="220" x2="760" y2="160"/>
  <text x="600" y="200" font-size="11" fill="#1565c0">buys</text>

  <line x1="350" y1="260" x2="350" y2="380"/>
  <text x="360" y="330" font-size="11">sends</text>

  <line x1="700" y1="200" x2="640" y2="380"/>
  <text x="670" y="320" font-size="11">has review</text>

  <!-- Legend -->
  <rect x="780" y="500" width="200" height="120" fill="#fafafa" stroke="#888"/>
  <text x="880" y="520" text-anchor="middle" font-weight="bold">Legend</text>
  <text class="pk" x="790" y="545">underlined</text><text x="870" y="545">= Primary Key</text>
  <text class="fk" x="790" y="565">italic red</text><text x="870" y="565">= Foreign Key</text>
  <text x="790" y="585" font-size="11">1..N = One-to-Many</text>
  <text x="790" y="605" font-size="11">EERD - shows inheritance via roles</text>
</svg>
