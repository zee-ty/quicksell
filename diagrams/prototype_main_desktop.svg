    <text x="55" y="445" fill="#1976d2" font-weight="bold">R 6,500.00</text>
  </g>
  <g>
    <rect x="380" y="280" width="320" height="180" fill="#fff" stroke="#ccc"/>
    <rect x="380" y="280" width="320" height="100" fill="#dee2e6"/>
    <text x="540" y="335" text-anchor="middle" fill="#aaa">Image</text>
