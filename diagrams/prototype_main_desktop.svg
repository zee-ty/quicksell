<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Arial, sans-serif" font-size="12">
  <rect width="1100" height="700" fill="#f8f9fa"/>
  <text x="550" y="25" text-anchor="middle" font-size="18" font-weight="bold">Main Website - Desktop (1100px)</text>

  <!-- Browser frame -->
  <rect x="20" y="50" width="1060" height="630" fill="#fff" stroke="#888" stroke-width="2"/>
  <rect x="20" y="50" width="1060" height="25" fill="#e0e0e0"/>
  <circle cx="35" cy="62" r="5" fill="#ff5f56"/>
  <circle cx="50" cy="62" r="5" fill="#ffbd2e"/>
  <circle cx="65" cy="62" r="5" fill="#27c93f"/>
  <text x="100" y="66" font-size="11">https://quicksell.example.com</text>

  <!-- Nav bar -->
  <rect x="20" y="75" width="1060" height="50" fill="#1976d2"/>
  <text x="40" y="105" fill="#fff" font-size="18" font-weight="bold">QuickSell</text>
  <text x="780" y="105" fill="#fff">Home  Sell  Login  Register</text>

  <!-- Hero -->
  <rect x="20" y="125" width="1060" height="120" fill="#e3f2fd"/>
