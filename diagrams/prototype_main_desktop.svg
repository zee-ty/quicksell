  <text x="550" y="190" text-anchor="middle" fill="#555">QuickSell connects buyers and sellers directly.</text>
  <rect x="350" y="200" width="400" height="30" fill="#fff" stroke="#aaa"/>
  <text x="365" y="220" fill="#999">Search listings...</text>

  <!-- Listings grid (3x2) -->
  <g>
