<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" font-family="Arial, sans-serif" font-size="11">
  <rect width="400" height="800" fill="#f8f9fa"/>
  <text x="200" y="20" text-anchor="middle" font-size="15" font-weight="bold">Main Website - Mobile (375px)</text>

  <rect x="80" y="40" width="240" height="740" fill="#fff" stroke="#444" stroke-width="3" rx="25"/>
  <rect x="80" y="40" width="240" height="15" fill="#222" rx="25"/>
  <circle cx="200" cy="48" r="3" fill="#444"/>

  <!-- Nav -->
  <rect x="80" y="55" width="240" height="38" fill="#1976d2"/>
  <text x="95" y="80" fill="#fff" font-weight="bold">TradeMate</text>
  <text x="295" y="80" fill="#fff" font-size="18">≡</text>

  <!-- Hero -->
  <rect x="80" y="93" width="240" height="100" fill="#e3f2fd"/>
  <text x="200" y="125" text-anchor="middle" font-size="13" font-weight="bold">Buy &amp; Sell</text>
  <text x="200" y="145" text-anchor="middle" font-size="10" fill="#555">Connect with locals</text>
  <rect x="95" y="155" width="210" height="25" fill="#fff" stroke="#aaa"/>
  <text x="105" y="173" fill="#999" font-size="10">Search...</text>

  <!-- Single column listings -->
  <g>
    <rect x="100" y="210" width="200" height="170" fill="#fff" stroke="#ccc"/>
    <rect x="100" y="210" width="200" height="90" fill="#dee2e6"/>
    <text x="200" y="260" text-anchor="middle" fill="#aaa">Image</text>
    <text x="110" y="320" font-weight="bold">iPhone 12 - 128GB</text>
    <text x="110" y="340" font-size="10" fill="#777">Electronics • Cape Town</text>
    <text x="110" y="365" fill="#1976d2" font-weight="bold">R 6,500.00</text>
  </g>
  <g>
    <rect x="100" y="400" width="200" height="170" fill="#fff" stroke="#ccc"/>
    <rect x="100" y="400" width="200" height="90" fill="#dee2e6"/>
    <text x="200" y="450" text-anchor="middle" fill="#aaa">Image</text>
    <text x="110" y="510" font-weight="bold">Nike Air Max</text>
    <text x="110" y="530" font-size="10" fill="#777">Fashion • Joburg</text>
    <text x="110" y="555" fill="#1976d2" font-weight="bold">R 850.00</text>
  </g>
  <g>
    <rect x="100" y="590" width="200" height="170" fill="#fff" stroke="#ccc"/>
    <rect x="100" y="590" width="200" height="90" fill="#dee2e6"/>
    <text x="200" y="640" text-anchor="middle" fill="#aaa">Image</text>
    <text x="110" y="700" font-weight="bold">Coffee Table</text>
    <text x="110" y="720" font-size="10" fill="#777">Home • Durban</text>
    <text x="110" y="745" fill="#1976d2" font-weight="bold">R 1,200.00</text>
  </g>
</svg>
