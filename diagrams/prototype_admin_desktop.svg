<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Arial, sans-serif" font-size="12">
  <rect width="1100" height="700" fill="#f8f9fa"/>
  <text x="550" y="25" text-anchor="middle" font-size="18" font-weight="bold">Admin Website - Desktop (1100px)</text>

  <!-- Browser frame -->
  <rect x="20" y="50" width="1060" height="630" fill="#fff" stroke="#888" stroke-width="2"/>
  <rect x="20" y="50" width="1060" height="25" fill="#e0e0e0"/>
  <circle cx="35" cy="62" r="5" fill="#ff5f56"/>
  <circle cx="50" cy="62" r="5" fill="#ffbd2e"/>
  <circle cx="65" cy="62" r="5" fill="#27c93f"/>
  <text x="100" y="66" font-size="11">https://trademate.example.com/admin</text>

  <!-- Nav bar -->
  <rect x="20" y="75" width="1060" height="50" fill="#212529"/>
  <text x="40" y="105" fill="#fff" font-size="18" font-weight="bold">TradeMate Admin</text>
  <text x="850" y="105" fill="#fff" font-size="12">Role: super_admin | Logout</text>

  <!-- Sidebar -->
  <rect x="20" y="125" width="200" height="555" fill="#343a40"/>
  <text x="40" y="160" fill="#fff" font-weight="bold">Dashboard</text>
  <text x="40" y="195" fill="#bbb">Users</text>
  <text x="40" y="230" fill="#bbb">Listings</text>
  <text x="40" y="265" fill="#bbb">Categories</text>
  <text x="40" y="300" fill="#bbb">Orders</text>
  <text x="40" y="335" fill="#bbb">Roles</text>
  <text x="40" y="370" fill="#bbb">Reports</text>

  <!-- Stats cards -->
  <rect x="240" y="145" width="260" height="100" fill="#fff" stroke="#dee2e6"/>
  <text x="260" y="175" fill="#666">Total Users</text>
  <text x="260" y="220" font-size="32" font-weight="bold" fill="#1976d2">158</text>

  <rect x="520" y="145" width="260" height="100" fill="#fff" stroke="#dee2e6"/>
  <text x="540" y="175" fill="#666">Active Listings</text>
  <text x="540" y="220" font-size="32" font-weight="bold" fill="#2e7d32">243</text>

  <rect x="800" y="145" width="260" height="100" fill="#fff" stroke="#dee2e6"/>
  <text x="820" y="175" fill="#666">Orders this month</text>
  <text x="820" y="220" font-size="32" font-weight="bold" fill="#f57c00">87</text>

  <!-- Users table -->
  <rect x="240" y="270" width="820" height="390" fill="#fff" stroke="#dee2e6"/>
  <text x="260" y="295" font-weight="bold" font-size="14">Manage Users (CRUD with RBAC)</text>

  <!-- Table header -->
  <rect x="260" y="310" width="780" height="30" fill="#212529"/>
  <text x="280" y="330" fill="#fff">ID</text>
  <text x="350" y="330" fill="#fff">Name</text>
  <text x="550" y="330" fill="#fff">Email</text>
  <text x="800" y="330" fill="#fff">Role</text>
  <text x="950" y="330" fill="#fff">Actions</text>

  <!-- Rows -->
  <g font-size="11">
    <rect x="260" y="340" width="780" height="30" fill="#f8f9fa"/>
    <text x="280" y="358">1</text>
    <text x="350" y="358">Site Admin</text>
    <text x="550" y="358">admin@trademate.co.za</text>
    <rect x="790" y="346" width="100" height="18" fill="#fff" stroke="#aaa"/>
    <text x="795" y="358">super_admin ▾</text>
    <rect x="950" y="346" width="50" height="18" fill="#dc3545"/>
    <text x="960" y="358" fill="#fff">Delete</text>

    <rect x="260" y="370" width="780" height="30" fill="#fff"/>
    <text x="280" y="388">2</text>
    <text x="350" y="388">Thabo Mokoena</text>
    <text x="550" y="388">thabo@example.com</text>
    <rect x="790" y="376" width="100" height="18" fill="#fff" stroke="#aaa"/>
    <text x="795" y="388">seller ▾</text>
    <rect x="950" y="376" width="50" height="18" fill="#dc3545"/>
    <text x="960" y="388" fill="#fff">Delete</text>

    <rect x="260" y="400" width="780" height="30" fill="#f8f9fa"/>
    <text x="280" y="418">3</text>
    <text x="350" y="418">Aisha Patel</text>
    <text x="550" y="418">aisha@example.com</text>
    <rect x="790" y="406" width="100" height="18" fill="#fff" stroke="#aaa"/>
    <text x="795" y="418">buyer ▾</text>
    <rect x="950" y="406" width="50" height="18" fill="#dc3545"/>
    <text x="960" y="418" fill="#fff">Delete</text>

    <rect x="260" y="430" width="780" height="30" fill="#fff"/>
    <text x="280" y="448">4</text>
    <text x="350" y="448">John Smith</text>
    <text x="550" y="448">john@example.com</text>
    <rect x="790" y="436" width="100" height="18" fill="#fff" stroke="#aaa"/>
    <text x="795" y="448">moderator ▾</text>
    <rect x="950" y="436" width="50" height="18" fill="#dc3545"/>
    <text x="960" y="448" fill="#fff">Delete</text>
  </g>
</svg>
